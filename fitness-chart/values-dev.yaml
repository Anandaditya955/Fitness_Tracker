namespace: fitness-dev

app:
  name: fitness-tracker
  replicas: 1
  image:
    repository: anandaditya955/fitness-tracker
    tag: v1
  containerPort: 5000

service:
  name: fitness-service
  type: LoadBalancer
  port: 80
  targetPort: 5000

config:
  NODE_ENV: development
  PORT: "5000"

secret:
  APP_SECRET: dev-secret

gateway:
  enabled: true
  gatewayClassName: fitness-gateway-class
  gatewayName: fitness-gateway
  routeName: fitness-route
